info:
  version: 1.0.7
  description: SMF initial local configuration

configuration:
  smfName: SMF
  sbi:
    scheme: http
    registerIPv4: smf.free5gc.org
    bindingIPv4: smf.free5gc.org
    port: 8000
    tls:
      key: cert/smf.key
      pem: cert/smf.pem
  serviceNameList:
    - nsmf-pdusession
    - nsmf-event-exposure
    - nsmf-oam
  snssaiInfos:
    - sNssai:
        sst: 1
      dnnInfos:
        - dnn: internet
          dns:
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
          pduSessionTypes:
            - IPv4
            - IPv6
            - IPv4v6
        - dnn: IMS
          dns:
            ipv4: 10.100.200.99
            ipv6: 2001:4860:4860::8888
          pcscf:
            ipv4: 10.100.200.99
            ipv6: 2001:4860:4860::8888
        - dnn: ims
          dns:
            ipv4: 10.100.200.99
            ipv6: 2001:4860:4860::8888
          pcscf:
            ipv4: 10.100.200.99
            ipv6: 2001:4860:4860::8888
    - sNssai:
        sst: 1
        sd: 000000
      dnnInfos:
        - dnn: internet
          dns:
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
          pduSessionTypes:
            - IPv4
            - IPv6
            - IPv4v6
        - dnn: IMS
          dns:
            ipv4: 10.100.200.99
            ipv6: 2001:4860:4860::8888
          pcscf:
            ipv4: 10.100.200.99
            ipv6: 2001:4860:4860::8888
        - dnn: ims
          dns:
            ipv4: 10.100.200.99
            ipv6: 2001:4860:4860::8888
          pcscf:
            ipv4: 10.100.200.99
            ipv6: 2001:4860:4860::8888
    - sNssai:
        sst: 1
        sd: 112233
      dnnInfos:
        - dnn: internet
          dns:
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
          pduSessionTypes:
            - IPv4
            - IPv6
            - IPv4v6
        - dnn: IMS
          dns:
            ipv4: 10.100.200.99
            ipv6: 2001:4860:4860::8888
          pcscf:
            ipv4: 10.100.200.99
            ipv6: 2001:4860:4860::8888
        - dnn: ims
          dns:
            ipv4: 10.100.200.99
            ipv6: 2001:4860:4860::8888
          pcscf:
            ipv4: 10.100.200.99
            ipv6: 2001:4860:4860::8888
  plmnList:
    - mcc: 001
      mnc: 01
  locality: area1
  pfcp:
    nodeID: smf.free5gc.org
    listenAddr: smf.free5gc.org
    externalAddr: smf.free5gc.org
  userplaneInformation:
    upNodes:
      gNB1:
        type: AN
      UPF:
        type: UPF
        nodeID: upf.free5gc.org
        addr: upf.free5gc.org
        sNssaiUpfInfos:
          - sNssai:
              sst: 1
            dnnUpfInfoList:
              - dnn: internet
                pools:
                  - cidr: 10.70.0.0/16
              - dnn: IMS
                pools:
                  - cidr: 10.72.0.0/16
              - dnn: ims
                pools:
                  - cidr: 10.74.0.0/16
          - sNssai:
              sst: 1
              sd: 000000
            dnnUpfInfoList:
              - dnn: internet
                pools:
                  - cidr: 10.60.0.0/16
                staticPools:
                  - cidr: 10.60.0.1/32
                  - cidr: 10.60.0.3/32
                  - cidr: 10.60.0.4/32
                  - cidr: 10.60.0.200/32
                  - cidr: 10.60.0.201/32
              - dnn: IMS
                pools:
                  - cidr: 10.62.0.0/16
              - dnn: ims
                pools:
                  - cidr: 10.64.0.0/16
                staticPools:
                  - cidr: 10.64.0.1/32
                  - cidr: 10.64.0.3/32
                  - cidr: 10.64.0.200/32
                  - cidr: 10.64.0.201/32
          - sNssai:
              sst: 1
              sd: 112233
            dnnUpfInfoList:
              - dnn: internet
                pools:
                  - cidr: 10.61.0.0/16
              - dnn: IMS
                pools:
                  - cidr: 10.63.0.0/16
              - dnn: ims
                pools:
                  - cidr: 10.65.0.0/16
        interfaces:
          - interfaceType: N3
            endpoints:
              - 10.88.120.100
            networkInstances:
              - internet
              - IMS
              - ims
    links:
      - A: gNB1
        B: UPF
  t3591:
    enable: true
    expireTime: 16s
    maxRetryTimes: 3
  t3592:
    enable: true
    expireTime: 16s
    maxRetryTimes: 3
  nrfUri: http://nrf.free5gc.org:8000
  nrfCertPem: cert/nrf.pem
  urrPeriod: 10
  urrThreshold: 1000
  requestedUnit: 1000
  metrics:
    enable: false
    scheme: http
    bindingIPv4: smf.free5gc.org
    port: 9091
    tls:
      pem: cert/smf.pem
      key: cert/smf.key
    namespace: free5gc

logger:
  enable: true
  level: info
  reportCaller: false
