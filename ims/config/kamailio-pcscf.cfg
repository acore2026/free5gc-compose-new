#!KAMAILIO
# Kamailio IMS P-CSCF Configuration for Free5GC

####### Global Parameters #########

debug=2
log_stderror=no
memdbg=5
memlog=5

log_facility=LOG_LOCAL0

fork=yes
children=4

auto_aliases=no

alias=ims.free5gc.org
alias=10.100.200.99

listen=udp:10.100.200.99:5060
listen=tcp:10.100.200.99:5060

mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

####### Modules Section #########

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "pv.so"
loadmodule "dialog.so"
loadmodule "xlog.so"
loadmodule "nathelper.so"
loadmodule "sanity.so"
loadmodule "sdpops.so"

####### Module Parameters #########

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

modparam("usrloc", "nat_bflag", 6)
modparam("usrloc", "matching_mode", 1)
modparam("usrloc", "db_mode", 0)

modparam("registrar", "received_avp", "$avp(received)")

modparam("dialog", "default_timeout", 3600)

####### Routing Logic ########

# Main SIP request routing logic
request_route {
    # Log incoming request
    xlog("L_INFO", "IMS Request: $rm from $fu to $ru\n");

    # Sanity check
    if (!sanity_check()) {
        xlog("L_WARN", "IMS: Malformed SIP message\n");
        send_reply(400, "Bad Request");
        exit;
    }

    if (!mf_process_maxfwd_header("10")) {
        send_reply(483, "Too Many Hops");
        exit;
    }

    if (msg:len >= 2048) {
        send_reply(513, "Message too big");
        exit;
    }

    # Handle REGISTER
    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    # Handle INVITE for voice calls
    if (is_method("INVITE")) {
        route(INVITE);
        exit;
    }

    # Handle BYE for call termination
    if (is_method("BYE")) {
        route(BYE);
        exit;
    }

    # Handle ACK
    if (is_method("ACK")) {
        route(ACK);
        exit;
    }

    # Handle CANCEL
    if (is_method("CANCEL")) {
        route(CANCEL);
        exit;
    }

    # Handle OPTIONS (keepalive)
    if (is_method("OPTIONS")) {
        send_reply(200, "OK");
        exit;
    }

    # Handle other requests
    route(RELAY);
}

route[REGISTER] {
    xlog("L_INFO", "IMS REGISTER received from $fu\n");

    # Save contact with NAT handling
    if (!save("location")) {
        send_reply(503, "Service Unavailable");
        exit;
    }

    xlog("L_INFO", "IMS REGISTER successful for $fu\n");
    send_reply(200, "OK");
    exit;
}

route[INVITE] {
    xlog("L_INFO", "IMS INVITE received from $fu to $ru\n");

    # Add record-route for dialog tracking
    if (!add_rr_param(";r2=on")) {
        xlog("L_WARN", "IMS: Failed to add RR param\n");
    }

    # Check if destination is registered
    if (!lookup("location")) {
        xlog("L_WARN", "IMS INVITE: User $ru not found\n");
        send_reply(404, "Not Found");
        exit;
    }

    xlog("L_INFO", "IMS INVITE routing to $du\n");
    route(RELAY);
}

route[BYE] {
    xlog("L_INFO", "IMS BYE received from $fu\n");

    if (!lookup("location")) {
        send_reply(404, "Not Found");
        exit;
    }

    route(RELAY);
}

route[ACK] {
    xlog("L_INFO", "IMS ACK received\n");
    route(RELAY);
}

route[CANCEL] {
    xlog("L_INFO", "IMS CANCEL received\n");
    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# Handle SIP responses
onreply_route {
    xlog("L_INFO", "IMS Response: $rs $rr from $si\n");

    if (is_method("INVITE") && $rs == "200") {
        xlog("L_INFO", "IMS INVITE 200 OK received\n");
    }
}

failure_route {
    xlog("L_WARN", "IMS Failure: $rs $rr\n");

    if (t_branch_timeout()) {
        send_reply(504, "Server Timeout");
        exit;
    }

    if (t_check_status("404")) {
        send_reply(404, "Not Found");
        exit;
    }
}